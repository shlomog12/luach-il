name: Deploy to GitHub Pages

# Only redeploy when a file that's actually part of the deployed site
# changes - not for doc-only changes (spec/, README.md, CLAUDE.md, etc.).
# Can always be triggered manually regardless, via workflow_dispatch.
on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'privacy.html'
      - 'sw.js'
      - 'icon.svg'
      - 'icon-180.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'favicon-32.png'
      - 'styles/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
